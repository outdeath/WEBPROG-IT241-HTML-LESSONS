<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEBPROG IT241</title>
  <link rel="stylesheet" href="css/dot.css">
</head>
<body>

<main class="panel">
  <section class="grid">

    <!-- LEFT COLUMN -->
    <div class="left-col">

      <div class="box avatar-box">
        <img src="https://i.pinimg.com/originals/68/b2/95/68b2950c09fe35541f08c756a4c21e9f.gif" alt="avatar">
      </div>

      <div class="box links-box">
        <ul>
          <li><strong><a href="#">instagram</a></strong></li>
          <li><strong><a href="#">twitter</a></strong></li>
          <li><strong><a href="#">github</a></strong></li>
          <li><strong><a href="#">spotify</a></strong></li>
        </ul>
      </div>

      <!-- STAMPS (RED AREA) -->
      <div class="box stamps-box">
        <div class="stamp-grid">
          <img src="https://pix.crd.co/assets/images/gallery14/c75b76f4.png">
          <img src="https://pix.crd.co/assets/images/gallery14/889c9e75.png">
          <img src="https://pix.crd.co/assets/images/gallery14/f28ab42a.gif">
          <img src="https://supplies.ju.mp/assets/images/gallery01/0383b620.png">
        </div>
      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-col">
      <div class="box intro-box">...</div>
      <div class="box interests-box">...</div>
      <div class="box contact-box">...</div>
    </div>

  </section>

  <!-- ================= GALLERY (PINK AREA) ================= -->
  <section class="box gallery-box">
    <h3>Gallery</h3>

    <!-- GALLERY WRAPPER -->
    <div class="gallery-wrapper">
      <button class="gallery-btn left" onclick="scrollGallery(-1)">&#10094;</button>

      <div class="gallery-track" id="galleryTrack">
        <!-- ADD / REMOVE IMAGES FREELY -->
        <img src="https://files.catbox.moe/z51k27.png" alt="me and bashang">
        <img src="https://files.catbox.moe/hp0p3w.png" alt="stinkys">
        <img src="https://files.catbox.moe/k79avg.png" alt="DEER">
        <img src="https://files.catbox.moe/exjk4b.png" alt="lil ole me and them">
        <img src="https://files.catbox.moe/fyddc4.png" alt="gian">
      </div>

      <button class="gallery-btn right" onclick="scrollGallery(1)">&#10095;</button>
    </div>
  </section>

  <!-- ================= GUESTBOOK (BLUE AREA) ================= -->
  <section class="box guestbook-box">
    <h3>Guestbook</h3>

    <form id="guestbookForm" class="guestbook-form">
      <input type="text" id="guestName" placeholder="Name (optional)">
      <textarea id="guestMessage" placeholder="Leave a message!" required></textarea>
      <button type="submit">Post</button>
    </form>

    <div id="guestbookEntries" class="guestbook-entries"></div>
  </section>

</main>

<!-- ================= JAVASCRIPT ================= -->
<script>
/* ---------- GUESTBOOK (localStorage) ---------- */
const form = document.getElementById("guestbookForm");
const entriesDiv = document.getElementById("guestbookEntries");

function loadEntries() {
  entriesDiv.innerHTML = "";
  const entries = JSON.parse(localStorage.getItem("guestbook")) || [];
  entries.forEach(entry => {
    const div = document.createElement("div");
    div.className = "guest-entry";
    div.innerHTML = `<strong>${entry.name}</strong>: ${entry.message}`;
    entriesDiv.prepend(div);
  });
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("guestName").value || "Anonymous";
  const message = document.getElementById("guestMessage").value;

  const entries = JSON.parse(localStorage.getItem("guestbook")) || [];
  entries.push({ name, message });
  localStorage.setItem("guestbook", JSON.stringify(entries));

  form.reset();
  loadEntries();
});

loadEntries();

/* ---------- GALLERY SCROLL ---------- */
function scrollGallery(direction) {
  const track = document.getElementById("galleryTrack");
  const scrollAmount = track.clientWidth * 0.6;
  track.scrollBy({ left: direction * scrollAmount, behavior: "smooth" });
}
</script>

</body>
</html>
